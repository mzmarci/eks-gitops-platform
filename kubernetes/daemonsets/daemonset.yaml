apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: node-agent
  namespace: online-boutique

spec:
  selector:
    matchLabels:
      app: node-agent

  template:
    metadata:
      labels:
        app: node-agent

    spec:
      containers:
        - name: node-agent
          image: nginx:alpine
          ports:
            - containerPort: 80