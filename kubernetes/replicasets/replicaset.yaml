apiVersion: apps/v1
kind: ReplicaSet

metadata:
  name: frontend-rs
  namespace: online-boutique

spec:
  replicas: 3

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: nginx:alpine

          ports:
            - containerPort: 80