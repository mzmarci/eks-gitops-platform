apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: database
  namespace: online-boutique

spec:
  serviceName: database
  replicas: 2

  selector:
    matchLabels:
      app: database

  template:
    metadata:
      labels:
        app: database

    spec:
      containers:
        - name: database
          image: nginx:alpine

          ports:
            - containerPort: 80

          volumeMounts:
            - name: database-storage
              mountPath: /data

  volumeClaimTemplates:

    - metadata:
        name: database-storage

      spec:
        accessModes:
          - ReadWriteOnce

        storageClassName: ebs-sc

        resources:
          requests:
            storage: 5Gi